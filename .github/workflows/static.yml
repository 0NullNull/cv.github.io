# Deploy the public parts of the site to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Only publish what the site needs: an allow-list, so notes, build
      # scripts or anything else left in the repo never goes public.
      - name: Collect public files
        run: |
          mkdir -p _site/images
          cp index.html en.html style.css favicon.svg _site/
          cp -r osaaminen _site/
          cp images/kuva.png _site/images/
          cp images/og*.png _site/images/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
